map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream mynews_radio_web {
    server web:3010;
}

server {
    listen 80;
    server_name _;

    # Client IPs and forwarding headers must not be written to request logs.
    access_log off;

    location / {
        proxy_pass http://mynews_radio_web;
        proxy_http_version 1.1;

        # Do not pass any client-controlled forwarding identity upstream.
        # proxy_set_header replaces the incoming value rather than appending it.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Verified-Client-IP $remote_addr;
        # $remote_addr is the normalized address of the TCP peer connected to
        # this public entry point. It is a single value, never a header list.
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
