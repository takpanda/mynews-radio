services:
  api:
    build:
      context: ./backend
    container_name: mynews-radio-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo
      - CRON_SCHEDULE=${CRON_SCHEDULE:-30 16 * * *}
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8010:8010"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload

  web:
    dns:
      - 127.0.0.11
    build:
      context: ./frontend
    container_name: mynews-radio-web
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "3010"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - STAGING_HEADER_CHECK=${STAGING_HEADER_CHECK:-0}
    command: npm run dev
    depends_on:
      - api

  # The only public entry point for Next.js. Keep the web container unbound to
  # the host so requests cannot bypass the header-sanitizing proxy.
  proxy:
    image: nginx:1.27-alpine
    container_name: mynews-radio-proxy
    ports:
      - "3010:80"
    environment:
      - PUBLIC_ENTRY_TOKEN=${PUBLIC_ENTRY_TOKEN:?PUBLIC_ENTRY_TOKEN must be configured}
    volumes:
      - ./infra/nginx/public-entry.conf:/etc/nginx/templates/default.conf.template:ro
    command: >-
      /bin/sh -c 'envsubst "$$PUBLIC_ENTRY_TOKEN" < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf && exec nginx -g "daemon off;"'
    depends_on:
      - web
